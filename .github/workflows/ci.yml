name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project HubTool.Tests/HubTool.Tests.csproj -c Release
      - run: dotnet list HubTool/HubTool.csproj package --vulnerable --include-transitive
